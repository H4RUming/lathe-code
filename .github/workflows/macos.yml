name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debugger_probe:
        description: Run the LLDB launch/attach feasibility probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package tests
        run: swift test --package-path Packages/LatheKit --scratch-path .build/ci-tests
      - name: Localization keys and native UI text
        run: python3 Scripts/check-localization.py
      - name: Native app state regression tests
        run: swift test --package-path Apps/Lathe --scratch-path .build/ci-app-tests
      - name: Build native app and opt-in test tools
        run: Scripts/build-app.sh --developer-tools
      - name: Verify single app distribution
        run: |
          test -x .build/macos/Lathe.app/Contents/Helpers/lathe-runner
          test ! -e .build/macos/Lathe.app/Contents/Helpers/lathe-engine
      - name: Native app ownership and lifecycle smoke
        run: python3 Scripts/smoke-app.py --bin-dir .build/macos --output .build/probes/app-lifecycle.json
      - name: Engine and CLI integration smoke
        run: python3 Scripts/smoke-engine.py --bin-dir .build/macos
      - name: Runner integration smoke
        run: python3 Scripts/smoke-runner.py --runner .build/macos/lathe-runner
      - name: Agent loop with local HTTP fixture
        run: python3 Scripts/smoke-agent.py --bin-dir .build/macos --output .build/probes/agent.json
      - name: Experimental sandbox probe
        run: |
          result=0
          python3 Scripts/probe-sandbox.py --output .build/probes/sandbox.json || result=$?
          if [ "$result" = 2 ]; then
            echo 'Sandbox probe unsupported on this runner; inspect the diagnostic artifact.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$result"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lathe-probes
          path: |
            .build/probes/sandbox.json
            .build/probes/agent.json
            .build/probes/app-lifecycle.json
          if-no-files-found: ignore
      - name: Package development app
        run: ditto -c -k --sequesterRsrc --keepParent .build/macos/Lathe.app .build/macos/Lathe.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lathe-macOS-development
          path: .build/macos/Lathe.app.zip
          if-no-files-found: error
  debugger-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.debugger_probe
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: LLDB-DAP feasibility
        run: python3 Scripts/probe-lldb-dap.py --allow-unsupported --output .build/probes/lldb-dap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lathe-debugger-probe
          path: .build/probes/lldb-dap.json
          if-no-files-found: error
